name: Release

# Pushing a version tag (e.g. v1.0.0) on main builds a signed release APK and
# publishes it as a GitHub Release. See RELEASING.md for the one-time setup.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v5

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SHOLTO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The SHOLTO_KEYSTORE_BASE64 secret is missing. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Lint, test and build the signed release
        env:
          SHOLTO_KEYSTORE_FILE: release.jks
          SHOLTO_KEYSTORE_PASSWORD: ${{ secrets.SHOLTO_KEYSTORE_PASSWORD }}
          SHOLTO_KEY_ALIAS: ${{ secrets.SHOLTO_KEY_ALIAS }}
          SHOLTO_KEY_PASSWORD: ${{ secrets.SHOLTO_KEY_PASSWORD }}
        run: ./gradlew spotlessCheck test assembleRelease --console=plain

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="sholto-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Sholto $GITHUB_REF_NAME" --generate-notes

      - name: Remove the signing key
        if: always()
        run: rm -f release.jks
